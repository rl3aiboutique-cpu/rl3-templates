extends: default

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
    require-starting-space: true
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
    level: warning
  # Templated files (.pre-commit-config.yaml from rl3-templates) leave
  # blank-line gaps where Jinja conditionals collapse. 10 leaves headroom
  # for future flag combinations without re-tuning.
  empty-lines:
    max: 10

ignore: |
  node_modules/
  dist/
  build/
  .venv/
  .codi/
  .agents/
  .claude/
  frontend/src/client/
  **/*.lock
