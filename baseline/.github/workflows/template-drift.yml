name: template-drift

# Weekly check for upstream rl3-templates changes. Runs `copier update` and
# opens a PR to <integration_branch> with the diff. Conflicts are written
# as .rej files for manual resolution before merging.
#
# Authentication:
#   - If rl3-templates is in the same GitHub org, the default GITHUB_TOKEN
#     usually suffices.
#   - For cross-org access, add a fine-grained PAT named
#     RL3_TEMPLATES_PULL_TOKEN with `contents: read` on rl3-templates.
#
# Security: this workflow does NOT consume any user-controlled input
# (issue titles, PR titles, commit messages). All step env / output
# values come from internal step outputs and repo secrets.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RL3_TEMPLATES_PULL_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Copier
        run: pipx install copier

      - name: Configure git identity (rl3-templates-bot)
        run: |
          git config user.name "rl3-templates-bot"
          git config user.email "rl3-templates-bot@users.noreply.github.com"

      - name: Run copier update
        id: update
        run: |
          set -uo pipefail
          copier update --defaults --conflict rej --skip-answered 2>&1 | tee update.log
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if find . -name "*.rej" -not -path "./.git/*" | grep -q .; then
              echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Compose PR body
        if: steps.update.outputs.changed == 'true'
        id: pr_body
        env:
          HAS_CONFLICTS: ${{ steps.update.outputs.has_conflicts }}
        run: |
          {
            echo "## What this is"
            echo ""
            echo "Weekly \`copier update\` from \`rl3-templates\`. The baseline ships hooks, branch policy, and agent guardrails — updates flow back into this project via this PR."
            echo ""
            echo "## Conflicts"
            echo ""
            if [ "$HAS_CONFLICTS" = "true" ]; then
              echo "YES — see .rej files in the diff. Resolve them, delete the .rej files, then merge."
            else
              echo "No conflicts. Review the diff and merge."
            fi
            echo ""
            echo "## Verification before merge"
            echo ""
            echo "- [ ] Diff reviewed"
            echo "- [ ] \`pre-commit run --all-files\` passes locally"
            echo "- [ ] Any .rej files resolved and removed"
            echo ""
            echo "---"
            echo ""
            echo "Generated by .github/workflows/template-drift.yml."
          } > /tmp/pr_body.md
          echo "body_file=/tmp/pr_body.md" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RL3_TEMPLATES_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          base: develop
          branch: chore/rl3-templates-bot/sync
          delete-branch: true
          title: "chore(template): sync rl3-templates baseline"
          commit-message: "chore(template): sync rl3-templates baseline"
          body-path: /tmp/pr_body.md
